<!-- Autonomous Mode Warning Modal -->
<div id="autonomous-warning-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 30px; border-radius: 10px; max-width: 500px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
        <div style="font-size: 48px; margin-bottom: 15px;">⚠️</div>
        <h3 style="color: #e53e3e; margin-bottom: 15px;">Enable Autonomous Mode?</h3>
        <p style="color: #4a5568; margin-bottom: 20px;">
            In <strong>Autonomous Mode</strong>, the system will automatically execute trades without waiting for your confirmation.
            <br><br>
            <strong>This means:</strong><br>
            - Trades execute immediately when signals trigger<br>
            - Stop-loss and targets auto-close positions<br>
            - You receive notifications but no approval is required
        </p>
        <div style="display: flex; gap: 15px; justify-content: center;">
            <button onclick="confirmAutonomous()" style="background: #e53e3e; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                Yes, Enable Autonomous
            </button>
            <button onclick="cancelAutonomous()" style="background: #e2e8f0; color: #4a5568; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer;">
                Cancel
            </button>
        </div>
    </div>
</div>

<!-- Algorithm Task Confirmation Modal -->
<div id="algo-task-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 30px; border-radius: 10px; max-width: 520px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
        <h3 id="algo-modal-title" style="margin-bottom: 15px;"></h3>
        <div id="algo-modal-body" style="color: #4a5568; margin-bottom: 20px; max-height: 400px; overflow-y: auto;"></div>
        <div style="display: flex; gap: 15px; justify-content: flex-end;">
            <button onclick="cancelAlgoAction()" style="background: #e2e8f0; color: #4a5568; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Cancel</button>
            <button id="algo-modal-confirm-btn" style="padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white;"></button>
        </div>
    </div>
</div>
