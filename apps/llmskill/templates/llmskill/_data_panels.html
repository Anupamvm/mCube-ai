{# Shared "Get Data" button, included by both llmskill/verify_trade.html
   and trading/analysis_detail.html. Requires `symbol` and `expiry_date` in context;
   `position_id` is optional. Opens the tabbed results page in a new tab. #}
<style>
.llmskill-getdata-bar { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
.llmskill-btn { background: #3b82f6; color: white; border: none; padding: 0.65rem 1.5rem; border-radius: 0.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
.llmskill-btn:hover { background: #2563eb; }
.llmskill-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.llmskill-btn-ai { background: #9ca3af; cursor: not-allowed; }
</style>

<div class="llmskill-getdata-bar">
    <a class="llmskill-btn"
       target="_blank" rel="noopener"
       title="Opens in a new tab - reads only what's already stored in the database, makes no live API calls"
       href="{% url 'llmskill:get_data_view' %}?symbol={{ symbol|urlencode }}&expiry_date={{ expiry_date|urlencode }}{% if position_id %}&position_id={{ position_id }}{% endif %}">
        📊 Get Data (stored data only) ↗
    </a>
    <button class="llmskill-btn llmskill-btn-ai" disabled title="LLM trade verification — coming soon">✨ Verify with AI (coming soon)</button>
</div>
