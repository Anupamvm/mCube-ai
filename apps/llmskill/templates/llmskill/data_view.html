<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Data: {{ symbol }}{% if expiry_date %} — {{ expiry_date }}{% endif %}</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f3f4f6; color: #1f2937; line-height: 1.5;
    }

    /* ── Header ── */
    .topbar {
        position: sticky; top: 0; z-index: 20; background: white;
        border-bottom: 1px solid #e5e7eb; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .topbar-inner {
        max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem;
        display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem;
    }
    .topbar-title { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
    .topbar-symbol { font-size: 1.35rem; font-weight: 800; }
    .topbar-expiry { font-size: 0.85rem; color: #6b7280; }
    .topbar-badge {
        font-size: 0.7rem; font-weight: 600; color: #6b7280; background: #f3f4f6;
        padding: 2px 9px; border-radius: 999px;
    }
    .topbar-right { display: flex; align-items: center; gap: 0.75rem; font-size: 0.8rem; color: #9ca3af; }
    .topbar-btn {
        background: #f3f4f6; border: 1px solid #e5e7eb; color: #374151; cursor: pointer;
        padding: 0.4rem 0.9rem; border-radius: 0.4rem; font-size: 0.8rem; font-weight: 600;
        display: inline-flex; align-items: center; gap: 0.35rem;
    }
    .topbar-btn:hover { background: #e5e7eb; }
    .topbar-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Tab bar ── */
    .tabbar-wrap { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .tabbar {
        display: flex; gap: 0.35rem; overflow-x: auto; padding: 0.6rem 0 0.6rem;
        scrollbar-width: thin;
    }
    .tab {
        flex-shrink: 0; display: flex; align-items: center; gap: 0.45rem;
        padding: 0.5rem 0.85rem; border-radius: 0.5rem; cursor: pointer;
        font-size: 0.83rem; font-weight: 600; color: #6b7280; background: transparent;
        border: 1px solid transparent; white-space: nowrap; position: relative;
    }
    .tab:hover { background: #f3f4f6; color: #374151; }
    .tab.active { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .tab.empty { color: #c1c5cc; }
    .tab.empty.active { color: #6b7280; background: #f9fafb; border-color: #e5e7eb; }
    .tab-count {
        font-size: 0.68rem; font-weight: 700; padding: 1px 7px; border-radius: 999px;
        background: #e5e7eb; color: #6b7280;
    }
    .tab.active .tab-count { background: #bfdbfe; color: #1e3a8a; }
    .tab-count.has-data { background: #d1fae5; color: #065f46; }
    .tab.active .tab-count.has-data { background: #a7f3d0; color: #065f46; }

    /* ── Content ── */
    .content { max-width: 1200px; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; }

    #loading-state, #error-state {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 50vh; gap: 1rem; color: #6b7280;
    }
    .spinner {
        width: 42px; height: 42px; border: 4px solid #e5e7eb; border-top-color: #3b82f6;
        border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error-state { color: #dc2626; }
    .retry-btn {
        background: #3b82f6; color: white; border: none; padding: 0.5rem 1.25rem;
        border-radius: 0.5rem; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }

    .llmskill-error {
        background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; border-radius: 0.5rem;
        padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.85rem;
    }

    .panel-header {
        display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
        gap: 0.75rem; margin-bottom: 1rem;
    }
    .panel-header-left { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
    .panel-title { font-size: 1.05rem; font-weight: 700; }
    .panel-table-tag {
        font-size: 0.7rem; font-weight: 600; color: #6b7280; background: white;
        border: 1px solid #e5e7eb; padding: 2px 9px; border-radius: 999px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .panel-meta { font-size: 0.78rem; color: #9ca3af; }
    .panel-actions { display: flex; gap: 0.5rem; align-items: center; }
    .search-box {
        border: 1px solid #e5e7eb; border-radius: 0.4rem; padding: 0.4rem 0.7rem;
        font-size: 0.8rem; width: 200px; background: white;
    }
    .search-box:focus { outline: none; border-color: #93c5fd; }
    .link-btn {
        background: none; border: none; color: #3b82f6; font-size: 0.78rem; font-weight: 600;
        cursor: pointer; padding: 0.3rem 0.4rem;
    }
    .link-btn:hover { text-decoration: underline; }

    .note-box {
        background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 0.5rem;
        padding: 0.75rem 1rem; font-size: 0.83rem; margin-bottom: 1rem;
    }
    .empty-state {
        text-align: center; padding: 3rem 1rem; color: #9ca3af; font-size: 0.9rem;
        background: white; border-radius: 0.75rem; border: 1px dashed #e5e7eb;
    }

    /* row cards */
    .row-card {
        background: white; border: 1px solid #e5e7eb; border-radius: 0.6rem;
        margin-bottom: 0.6rem; overflow: hidden;
    }
    .row-summary {
        display: flex; align-items: center; gap: 0.7rem; padding: 0.7rem 0.9rem;
        cursor: pointer; user-select: none;
    }
    .row-summary:hover { background: #f9fafb; }
    .row-chevron { color: #9ca3af; font-size: 0.7rem; transition: transform 0.15s; flex-shrink: 0; }
    .row-card.expanded .row-chevron { transform: rotate(90deg); }
    .row-title { font-weight: 600; font-size: 0.87rem; color: #1f2937; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-date { font-size: 0.76rem; color: #9ca3af; flex-shrink: 0; }
    .row-badge {
        font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
    }
    .row-badge.pos { background: #d1fae5; color: #065f46; }
    .row-badge.neg { background: #fee2e2; color: #991b1b; }
    .row-badge.neu { background: #f3f4f6; color: #6b7280; }

    .row-detail {
        display: none; padding: 0 0.9rem 0.9rem; border-top: 1px solid #f3f4f6;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.5rem 1.25rem;
    }
    .row-card.expanded .row-detail { display: grid; }
    .kv { font-size: 0.79rem; overflow-wrap: anywhere; padding-top: 0.7rem; }
    .kv-key { color: #9ca3af; display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 0.15rem; }
    .kv-val { color: #1f2937; font-weight: 500; }
    .kv-val.full-width { grid-column: 1 / -1; }
    .llmskill-list { margin: 0; padding-left: 1.1rem; }
    .llmskill-list li { margin-bottom: 0.15rem; }
    .llmskill-nested { background: #f9fafb; border-radius: 0.4rem; padding: 0.4rem 0.6rem; font-size: 0.76rem; }
    .llmskill-nested-key { color: #9ca3af; margin-right: 0.3rem; }
    .showmore-btn {
        background: none; border: none; color: #3b82f6; font-size: 0.75rem; font-weight: 600;
        cursor: pointer; padding: 0; margin-left: 0.3rem;
    }

    @media print {
        .topbar-btn, .tabbar { display: none; }
    }
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-inner">
        <div class="topbar-title">
            <span class="topbar-symbol">📊 {{ symbol|default:"—" }}</span>
            {% if expiry_date %}<span class="topbar-expiry">Expiry: {{ expiry_date }}</span>{% endif %}
            <span class="topbar-badge" title="Reads only stored data - no live API calls">stored data only</span>
        </div>
        <div class="topbar-right">
            <span id="fetched-at"></span>
            <button class="topbar-btn" id="reload-btn" onclick="DataView.load()">↻ Reload</button>
        </div>
    </div>
    <div class="tabbar-wrap"><div class="tabbar" id="tabbar"></div></div>
</div>

<div class="content">
    <div id="loading-state">
        <div class="spinner"></div>
        <div>Reading stored data for {{ symbol }}…</div>
    </div>
    <div id="error-state" style="display:none;">
        <div id="error-msg"></div>
        <button class="retry-btn" onclick="DataView.load()">Retry</button>
    </div>
    <div id="panel-root" style="display:none;"></div>
</div>

<script>
const SYMBOL = '{{ symbol|escapejs }}';
const EXPIRY_DATE = '{{ expiry_date|escapejs }}';
const POSITION_ID = {% if position_id %}'{{ position_id|escapejs }}'{% else %}null{% endif %};

const DataView = (function () {
    'use strict';

    // Curated icon + short-label per known source, keyed by the backend's exact
    // label string. Falls back to a generic icon + auto-shortened label for any
    // source the aggregator adds later, so this page never needs a code change
    // just to display a new data source.
    const SOURCE_META = {
        'Prior Trade Suggestions (algorithm reasoning saved at suggestion time)': { icon: '🎯', short: 'Prior Suggestions' },
        'Trendlyne F&O Contract Data': { icon: '📑', short: 'F&O Contracts' },
        'Trendlyne Stock-Level F&O Summary': { icon: '📋', short: 'F&O Summary' },
        'Trendlyne Comprehensive Stock Data (fundamentals/technicals)': { icon: '🏢', short: 'Fundamentals' },
        'Trendlyne Analyst Price Targets (consensus)': { icon: '💰', short: 'Price Targets' },
        'Breeze Historical Price (cached OHLCV)': { icon: '📉', short: 'Historical Price' },
        'Breeze Option Chain Quotes (cached snapshots)': { icon: '⛓️', short: 'Option Chain' },
        'News Articles (with LLM sentiment/impact)': { icon: '📰', short: 'News' },
        'Analyst Research Reports (Trendlyne PDFs, LLM-analyzed)': { icon: '📄', short: 'Analyst Reports' },
        'Investor Calls / Earnings Transcripts': { icon: '🎙️', short: 'Earnings Calls' },
        'OI Intelligence (derived buildup/pattern analysis)': { icon: '🧠', short: 'OI Intelligence' },
        'OI History Snapshots (daily, raw)': { icon: '🗂️', short: 'OI History' },
        'NSE/BSE Corporate Announcements': { icon: '📢', short: 'Announcements' },
    };

    const TITLE_KEYS = ['title', 'report_title', 'company', 'name', 'symbol', 'event_type', 'call_type', 'recommendation_type', 'strategy'];
    const DATE_KEYS = ['published_at', 'report_date', 'call_date', 'trading_date', 'datetime', 'date', 'fetch_timestamp', 'created_at', 'updated_at'];
    const BADGE_KEYS = ['sentiment_score', 'confidence_score', 'trading_signal', 'management_tone', 'composite_score', 'score'];

    let state = { data: null, activeTab: 0, expanded: {}, filter: '' };

    function getCookie(name) {
        const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
        return v ? v.pop() : '';
    }

    function esc(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function metaFor(label) {
        if (SOURCE_META[label]) return SOURCE_META[label];
        return { icon: '📦', short: label.split(' (')[0].split(',')[0].slice(0, 22) };
    }

    function fmtTimestamp(iso) {
        if (!iso) return '';
        return String(iso).slice(0, 19).replace('T', ' ');
    }

    function load() {
        document.getElementById('loading-state').style.display = 'flex';
        document.getElementById('error-state').style.display = 'none';
        document.getElementById('panel-root').style.display = 'none';
        document.getElementById('reload-btn').disabled = true;

        const body = new URLSearchParams({ symbol: SYMBOL, expiry_date: EXPIRY_DATE });
        if (POSITION_ID) body.append('position_id', POSITION_ID);

        fetch('/llmskill/api/get-data/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': getCookie('csrftoken') },
            body: body.toString(),
        })
            .then(r => r.json())
            .then(resp => {
                document.getElementById('reload-btn').disabled = false;
                if (!resp.success) {
                    showError(resp.error || 'Failed to fetch data');
                    return;
                }
                state.data = resp.data;
                state.activeTab = firstMeaningfulTab(resp.data.sources);
                state.expanded = {};
                document.getElementById('fetched-at').textContent = 'Fetched ' + new Date().toLocaleTimeString();
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('panel-root').style.display = 'block';
                renderTabs();
                renderPanel();
            })
            .catch(err => {
                document.getElementById('reload-btn').disabled = false;
                showError(err.message || String(err));
            });
    }

    function showError(msg) {
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('panel-root').style.display = 'none';
        document.getElementById('error-state').style.display = 'flex';
        document.getElementById('error-msg').textContent = msg;
    }

    function firstMeaningfulTab(sources) {
        const idx = sources.findIndex(s => s.count > 0);
        return idx === -1 ? 0 : idx;
    }

    function renderTabs() {
        const sources = state.data.sources;
        const html = sources.map((s, i) => {
            const meta = metaFor(s.label);
            const active = i === state.activeTab;
            const empty = s.count === 0;
            return `<div class="tab ${active ? 'active' : ''} ${empty ? 'empty' : ''}" onclick="DataView.selectTab(${i})" title="${esc(s.label)}">
                <span>${meta.icon}</span>
                <span>${esc(meta.short)}</span>
                <span class="tab-count ${s.count > 0 ? 'has-data' : ''}">${s.count}</span>
            </div>`;
        }).join('');
        document.getElementById('tabbar').innerHTML = html;
    }

    function selectTab(i) {
        state.activeTab = i;
        state.filter = '';
        renderTabs();
        renderPanel();
    }

    function toggleRow(rowId) {
        state.expanded[rowId] = !state.expanded[rowId];
        const el = document.getElementById(rowId);
        if (el) el.classList.toggle('expanded', state.expanded[rowId]);
    }

    function setAllExpanded(val) {
        const s = state.data.sources[state.activeTab];
        (s.rows || []).forEach((_, i) => { state.expanded[`row-${state.activeTab}-${i}`] = val; });
        renderPanel();
    }

    function onFilterInput(val) {
        state.filter = val.toLowerCase();
        renderRows();
    }

    function summarizeRow(row) {
        let title = null;
        for (const k of TITLE_KEYS) { if (row[k]) { title = String(row[k]); break; } }
        if (!title) {
            for (const [k, v] of Object.entries(row)) {
                if (k === 'id' || v === null || v === undefined || v === '') continue;
                if (typeof v === 'string') { title = v; break; }
            }
        }
        let date = null;
        for (const k of DATE_KEYS) { if (row[k]) { date = row[k]; break; } }

        let badge = null;
        for (const k of BADGE_KEYS) {
            if (row[k] !== undefined && row[k] !== null && row[k] !== '') { badge = { key: k, value: row[k] }; break; }
        }

        return { title: title || '(row)', date, badge };
    }

    function badgeHtml(badge) {
        if (!badge) return '';
        const { key, value } = badge;
        let cls = 'neu', text = String(value);
        if (key === 'sentiment_score' || key === 'confidence_score' || key === 'score' || key === 'composite_score') {
            const n = Number(value);
            if (!isNaN(n)) {
                cls = n > 0.15 ? 'pos' : n < -0.15 ? 'neg' : 'neu';
                text = key === 'composite_score' ? `${n}/100` : n.toFixed(2);
            }
        } else if (key === 'trading_signal' || key === 'management_tone') {
            const v = String(value).toUpperCase();
            cls = (v === 'BULLISH' || v === 'POSITIVE') ? 'pos' : (v === 'BEARISH' || v === 'NEGATIVE') ? 'neg' : 'neu';
        }
        return `<span class="row-badge ${cls}">${esc(text)}</span>`;
    }

    function renderValue(value) {
        if (value === null || value === undefined || value === '') return null;
        if (Array.isArray(value)) {
            if (!value.length) return null;
            return { html: `<ul class="llmskill-list">${value.map(v => `<li>${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</li>`).join('')}</ul>`, wide: true };
        }
        if (typeof value === 'object') {
            const entries = Object.entries(value).filter(([, v]) => v !== null && v !== '');
            if (!entries.length) return null;
            return { html: `<div class="llmskill-nested">${entries.map(([k, v]) => `<div><span class="llmskill-nested-key">${esc(k)}:</span>${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</div>`).join('')}</div>`, wide: true };
        }
        const str = String(value);
        if (str.length > 280) {
            const id = 'val_' + Math.random().toString(36).slice(2, 9);
            return {
                html: `<span id="${id}-short">${esc(str.slice(0, 280))}…</span><span id="${id}-full" style="display:none">${esc(str)}</span> <button class="showmore-btn" onclick="DataView.toggleText('${id}', this)">Show more</button>`,
                wide: str.length > 500,
            };
        }
        return { html: esc(str), wide: false };
    }

    function toggleText(id, btn) {
        const short = document.getElementById(id + '-short');
        const full = document.getElementById(id + '-full');
        const isShort = short.style.display !== 'none';
        short.style.display = isShort ? 'none' : '';
        full.style.display = isShort ? '' : 'none';
        btn.textContent = isShort ? 'Show less' : 'Show more';
    }

    function rowMatchesFilter(row, filter) {
        if (!filter) return true;
        return JSON.stringify(row).toLowerCase().includes(filter);
    }

    function renderRows() {
        const container = document.getElementById('rows-container');
        if (!container) return;
        const s = state.data.sources[state.activeTab];
        const rows = s.rows || [];
        const filtered = rows.filter(r => rowMatchesFilter(r, state.filter));

        if (!rows.length) {
            container.innerHTML = `<div class="empty-state">No ${esc(s.label.split(' (')[0])} found for ${esc(SYMBOL)}${s.note ? '<br><br>' + esc(s.note) : ''}</div>`;
            return;
        }
        if (!filtered.length) {
            container.innerHTML = `<div class="empty-state">No rows match "${esc(state.filter)}"</div>`;
            return;
        }

        container.innerHTML = filtered.map(row => {
            const origIndex = rows.indexOf(row);
            const rowId = `row-${state.activeTab}-${origIndex}`;
            const summary = summarizeRow(row);
            const isExpanded = !!state.expanded[rowId];

            const fields = Object.keys(row)
                .filter(k => row[k] !== null && row[k] !== '' && row[k] !== undefined)
                .map(k => {
                    const rendered = renderValue(row[k]);
                    if (!rendered) return '';
                    return `<div class="kv"><span class="kv-key">${esc(k)}</span><span class="kv-val ${rendered.wide ? 'full-width' : ''}">${rendered.html}</span></div>`;
                }).join('');

            return `<div class="row-card ${isExpanded ? 'expanded' : ''}" id="${rowId}">
                <div class="row-summary" onclick="DataView.toggleRow('${rowId}')">
                    <span class="row-chevron">▶</span>
                    <span class="row-title">${esc(summary.title)}</span>
                    ${summary.date ? `<span class="row-date">${esc(fmtTimestamp(summary.date))}</span>` : ''}
                    ${badgeHtml(summary.badge)}
                </div>
                <div class="row-detail">${fields}</div>
            </div>`;
        }).join('');
    }

    function renderPanel() {
        const s = state.data.sources[state.activeTab];
        const errors = state.data.errors || [];
        const root = document.getElementById('panel-root');

        root.innerHTML = `
            ${errors.length ? errors.map(e => `<div class="llmskill-error">⚠️ ${esc(e)}</div>`).join('') : ''}
            <div class="panel-header">
                <div class="panel-header-left">
                    <span class="panel-title">${metaFor(s.label).icon} ${esc(s.label)}</span>
                    ${s.table ? `<span class="panel-table-tag">${esc(s.table)}</span>` : ''}
                    <span class="panel-meta">${s.count} row(s)${s.last_updated ? ' · last updated ' + esc(fmtTimestamp(s.last_updated)) : ''}</span>
                </div>
                <div class="panel-actions">
                    ${s.rows && s.rows.length ? `
                        <input class="search-box" placeholder="Filter rows…" oninput="DataView.onFilterInput(this.value)">
                        <button class="link-btn" onclick="DataView.setAllExpanded(true)">Expand all</button>
                        <button class="link-btn" onclick="DataView.setAllExpanded(false)">Collapse all</button>
                    ` : ''}
                </div>
            </div>
            ${s.note && s.count === 0 ? `<div class="note-box">ℹ️ ${esc(s.note)}</div>` : ''}
            <div id="rows-container"></div>
        `;
        renderRows();
    }

    return { load, selectTab, toggleRow, setAllExpanded, onFilterInput, toggleText };
})();

document.addEventListener('DOMContentLoaded', DataView.load);
</script>
</body>
</html>
